name: Build release packages

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to upload packages to
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            archive: TaskbarFishing-windows-x64.zip
          - runner: ubuntu-24.04
            platform: linux-x64
            archive: TaskbarFishing-linux-x64.tar.gz
          - runner: macos-15
            platform: macos-arm64
            archive: TaskbarFishing-macos-arm64.tar.gz
          - runner: macos-15-intel
            platform: macos-x64
            archive: TaskbarFishing-macos-x64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Install release files
        run: cmake --install build --config Release --prefix package --component Game

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}" -Force

      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" -C package .

      - name: Save package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach packages to GitHub Release
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
